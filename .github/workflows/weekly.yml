# `DriverrTests` and the Release build, once a week on `main` and on request. They are not
# on pull requests because a simulator run on a hosted runner takes too long to wait for.
#
# GitHub turns a scheduled workflow off after 60 days with no activity in the repository.
name: Weekly

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Names bash so every step runs with `-o pipefail`.
    shell: bash

jobs:
  app:
    name: DriverrTests and Release build
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DESTINATION: platform=iOS Simulator,name=Driverr iPhone 17
    steps:
      - uses: actions/checkout@v5

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # The image carries more than one runtime, and a beta can be the newest. The device
      # takes the runtime of the active Xcode's own SDK.
      - name: Create the named simulator
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)"
          xcrun simctl list devices available | grep -q '    Driverr iPhone 17 (' ||
            xcrun simctl create "Driverr iPhone 17" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME"
          xcrun simctl list devices available | grep -B3 'Driverr iPhone 17 ('

      - name: DriverrTests
        run: |
          xcodebuild test \
            -project Driverr.xcodeproj -scheme Driverr \
            -destination "$DESTINATION" \
            -only-testing:DriverrTests \
            -resultBundlePath "$RUNNER_TEMP/DriverrTests.xcresult" \
            > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/tests.log"; exit 1; }

      # xcodebuild exits 0 when the filter matches nothing, so the count is the result.
      - name: Check that tests ran
        run: |
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/DriverrTests.xcresult" > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          passed, failed = s.get("passedTests", 0), s.get("failedTests", 0)
          print(f"result {s.get('result')}: {passed} passed, {failed} failed, "
                f"{s.get('skippedTests', 0)} skipped of {s.get('totalTestCount', 0)}")
          sys.exit(0 if passed > 0 and failed == 0 else 1)
          PY

      # The three tiers build Debug only. A DEBUG-only symbol used from Release code
      # passes all of them and fails at the archive.
      - name: Release build
        run: |
          xcodebuild build \
            -project Driverr.xcodeproj -scheme Driverr \
            -configuration Release \
            -destination "$DESTINATION" \
            > "$RUNNER_TEMP/release.log" 2>&1 || { tail -80 "$RUNNER_TEMP/release.log"; exit 1; }

      - name: Report warnings
        if: always()
        run: scripts/ci-warnings.sh "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/release.log"

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/DriverrTests.xcresult
          retention-days: 7

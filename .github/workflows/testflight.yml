# Archives `main`, validates the archive with App Store Connect and uploads it to
# TestFlight. A push to `main` that changes the app uploads. A manual run validates only,
# unless it is told to upload.
#
# Validation costs nothing. An upload uses its build number for good, so the manual run
# stops before it by default.
#
# The secrets live in the `testflight` environment, which only this workflow names:
#   ASC_KEY_ID, ASC_ISSUER_ID   an App Store Connect API key and its issuer
#   ASC_KEY_P8                  the text of that key's .p8 file
#   SIGNING_P12_BASE64          a .p12 holding an Apple Development identity, base64
#                               encoded. The archive signs with it. The export signs with
#                               the distribution certificate Apple holds for the team.
#   SIGNING_P12_PASSWORD        the password of that .p12
#
# No log is kept as an artifact. The archive log holds the key's identifiers, and an
# artifact is not masked the way the run's own output is.
#
# Two repository variables are optional, and both are off when unset. scripts/testflight.mjs
# says what each one does: EXPORT_COMPLIANCE_EXEMPT and TESTFLIGHT_EXTERNAL_GROUPS.
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - Driverr/**
      - DriverrKit/**
      - DriverrWatch/**
      - Driverr.xcodeproj/**
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build after it validates. Off validates only.
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, and never cancelled part way: a cancelled upload can still have used its
# build number.
concurrency:
  group: testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  archive:
    name: Archive and upload
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: testflight
    permissions:
      contents: write # the build tag
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v5

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Read the project's own facts
        run: |
          echo "OUT=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          xcodebuild -project Driverr.xcodeproj -target Driverr -configuration Release \
            -showBuildSettings 2>/dev/null > "$RUNNER_TEMP/settings.txt"
          setting() { awk -v k="$1" '$1 == k && $2 == "=" { print $3; exit }' "$RUNNER_TEMP/settings.txt"; }
          for key in PRODUCT_BUNDLE_IDENTIFIER DEVELOPMENT_TEAM MARKETING_VERSION; do
            value="$(setting "$key")"
            [ -n "$value" ] || { echo "::error::no $key in the build settings"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done

      # altool finds the key by its file name, in a `private_keys` directory under the
      # home directory. xcodebuild takes the same file by path.
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] ||
            { echo "::error::the testflight environment has no App Store Connect key"; exit 1; }
          mkdir -p "$(dirname "$ASC_KEY_PATH")" ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/
          chmod 600 "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/*.p8

      # The identity is imported so that Xcode signs with one that exists. A runner with
      # none asks Apple for a new development certificate on every run.
      - name: Import the signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$SIGNING_P12_PASSWORD" \
            -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/signing.p12"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          grep -q '"Apple Development: ' <<< "$IDENTITIES" ||
            { echo "::error::the .p12 has no Apple Development identity"; exit 1; }

      # The committed CURRENT_PROJECT_VERSION is a placeholder. The number comes from the
      # newest build App Store Connect holds.
      - name: Choose the build number
        run: |
          NEXT="$(node scripts/testflight.mjs next-build "$PRODUCT_BUNDLE_IDENTIFIER")"
          [[ "$NEXT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::no build number: '$NEXT'"; exit 1; }
          echo "NEXT=$NEXT" | tee -a "$GITHUB_ENV"

      # No -configuration: the scheme's archive action already names Release.
      - name: Archive
        run: |
          mkdir -p "$OUT"
          xcodebuild archive \
            -project Driverr.xcodeproj -scheme Driverr \
            -destination 'generic/platform=iOS' \
            -archivePath "$OUT/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$NEXT" \
            > "$OUT/archive.log" 2>&1 || { tail -150 "$OUT/archive.log"; exit 1; }
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$OUT/archive.log"

      - name: Export
        run: |
          cat > "$OUT/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          # Homebrew's rsync on PATH breaks the export's copy step: "Copy failed", exit 70.
          CLEAN_PATH="$(tr ':' '\n' <<< "$PATH" | grep -v '^/opt/homebrew' | paste -sd: -)"
          PATH="$CLEAN_PATH" xcodebuild -exportArchive \
            -archivePath "$OUT/App.xcarchive" \
            -exportOptionsPlist "$OUT/ExportOptions.plist" \
            -exportPath "$OUT/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$OUT/export.log" 2>&1 || { tail -150 "$OUT/export.log"; exit 1; }
          grep -q '\*\* EXPORT SUCCEEDED \*\*' "$OUT/export.log"

      # codesign on the .ipa itself exits 0 for an unsigned bundle, so this reads the .app
      # inside it and every bundle nested in that.
      - name: Verify the exported bundle
        run: |
          IPA="$(ls "$OUT"/export/*.ipa | head -1)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          unzip -q "$IPA" -d "$OUT/ipa"
          APP="$(ls -d "$OUT"/ipa/Payload/*.app | head -1)"
          while IFS= read -r bundle; do
            authority="$(codesign -dvvv "$bundle" 2>&1 | grep '^Authority=' | head -1)"
            echo "$(basename "$bundle")  ${authority:-no Authority line}"
            [[ "$authority" == "Authority=Apple Distribution:"*"($DEVELOPMENT_TEAM)" ]] ||
              { echo "::error::$(basename "$bundle") is not signed Apple Distribution"; exit 1; }
          done < <(find "$APP" \( -name '*.app' -o -name '*.appex' \) -print)
          check() {
            got="$(plutil -extract "$1" raw "$APP/Info.plist")"
            echo "$1 = $got"
            [ "$got" = "$2" ] || { echo "::error::$1 is $got, expected $2"; exit 1; }
          }
          check CFBundleIdentifier "$PRODUCT_BUNDLE_IDENTIFIER"
          check CFBundleShortVersionString "$MARKETING_VERSION"
          check CFBundleVersion "$NEXT"

      - name: Validate
        run: |
          xcrun altool --validate-app -f "$IPA" -t ios \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
            > "$OUT/validate.log" 2>&1 || { tail -40 "$OUT/validate.log"; exit 1; }
          grep -q 'VERIFY SUCCEEDED' "$OUT/validate.log"

      - name: Upload
        if: env.UPLOAD == 'true'
        run: |
          xcrun altool --upload-app -f "$IPA" -t ios \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
            > "$OUT/upload.log" 2>&1 || { tail -40 "$OUT/upload.log"; exit 1; }
          grep -q 'UPLOAD SUCCEEDED' "$OUT/upload.log"

      # The tag is the record of which commit a build number came from.
      - name: Tag the commit
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/build/$MARKETING_VERSION-$NEXT" -f sha="$GITHUB_SHA" --silent

      - name: Release to testers
        if: env.UPLOAD == 'true'
        env:
          EXPORT_COMPLIANCE_EXEMPT: ${{ vars.EXPORT_COMPLIANCE_EXEMPT }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_GROUPS }}
          # A manual run has no commit message.
          NOTES: ${{ github.event.head_commit.message || 'A build of main, started by hand.' }}
        run: |
          node scripts/testflight.mjs release "$PRODUCT_BUNDLE_IDENTIFIER" "$NEXT" \
            --notes "$(head -1 <<< "$NOTES")"

      - name: Summary
        if: always()
        run: |
          {
            echo "Build ${NEXT:-not chosen} of ${MARKETING_VERSION:-unknown}, commit $GITHUB_SHA."
            if [ "$UPLOAD" = true ]; then echo "Uploaded if the Upload step is green."
            else echo "Validated only. Nothing was uploaded and no build number was used."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key and the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$(dirname "$ASC_KEY_PATH")" ~/.appstoreconnect/private_keys

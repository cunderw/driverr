name: Chore
description: Maintenance, tooling, tests or docs. No change in what the app does.
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: |
        A chore changes how Driverr is built, tested or documented, not what it does. If
        the change is visible to someone using the app, use the feature or bug template.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Exactly one.
      options:
        - "area:ios — the app, its screens, its tests"
        - "area:ssh — transport, auth, host keys"
        - "area:herdr — the herdr control surface"
        - "area:infra — build, release, tooling"
        - "area:design — product and interaction"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What
      description: The deliverable, in a sentence or two. What would be different when this is done?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What this costs today. Concrete beats general.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: >
        How anyone would know it was done. Write criteria that can *fail*: "works
        correctly" is not a criterion.
      value: |
        - [ ] 
        - [ ] 
        - [ ] Build is warning-free
    validations:
      required: true

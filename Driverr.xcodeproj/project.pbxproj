/* DriverrTests (DB02) deliberately does NOT carry its own DriverrCore product
   dependency. Its EB03/EB04 build configs set BUNDLE_LOADER/TEST_HOST to
   Driverr.app's executable, so the test bundle is loaded directly into the
   running Driverr.app process by the test host mechanism, not by linking the
   package itself. DriverrTests.swift reaches DriverrCore through a plain
   `import DriverrCore` for exactly that reason. (Separately,
   KeychainIdentityStoreTests.swift does `@testable import Driverr` to reach
   app-target code — that needs ENABLE_TESTABILITY = YES on EB01, and is
   unrelated to package product dependencies.) The app process already links
   DriverrCore, and because
   DB01 is left as SwiftPM's only consumer of the product, its "automatic"
   library type resolves DriverrCore to a static library merged directly into
   Driverr.debug.dylib (no separate .framework at all); the test bundle picks
   up DriverrCore's compiled code and module interface by running inside that
   host process, and at runtime nothing is loaded twice. If DriverrTests also
   declared its own packageProductDependencies on DriverrCore,
   DriverrCore.framework would be built and physically embedded twice — once
   under Driverr.app/Frameworks/ and again under
   Driverr.app/PlugIns/DriverrTests.xctest/Frameworks/ — which Apple's docs warn
   "may cause spurious casting failures and mysterious crashes". Do not re-add a
   packageProductDependency
   to DB02 without re-checking for duplicate framework embeds under
   Driverr.app/PlugIns/DriverrTests.xctest in the DerivedData build products
   (that directory should have no .framework bundles). */


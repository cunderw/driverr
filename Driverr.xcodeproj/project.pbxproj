/* Synchronized folder exceptions — Driverr/Info.plist is consumed via
   INFOPLIST_FILE + GENERATE_INFOPLIST_FILE, not copied as a bundle
   resource; without this exception the synchronized group also puts it in
   the Copy Bundle Resources phase, colliding with the generated Info.plist
   at the same output path.

   The `.entitlements` files are listed for the same reason: a synchronized group
   treats an unrecognised plist as a bundle resource, and an entitlements file copied into
   the product is both wrong and invisible — it does not collide, so the build stays green.
   Their real consumer is CODE_SIGN_ENTITLEMENTS on EB01/EB02 and EB09/EB10. */
